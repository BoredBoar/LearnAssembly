; LearnAssembly - AVR assembly teaching project
;
; Two boards are supported. The lesson sources are identical for both; the
; pin-to-port map that differs between the chips lives in include/board.inc.
;
;   pio run -e mega-01-blink -t upload     # ATmega2560 (Mega / ELEGOO MEGA)
;   pio run -e uno-01-blink  -t upload     # ATmega328P (Uno / ELEGOO UNO)
;   pio run                                # build the default env only
;   pio run -e mega-01-blink -t size       # show flash/RAM used
;
; Environment names read as <board>-<lesson>. Each lesson is its own env so
; students can build and flash one at a time without deleting the others.
;
; There is no `framework` line on purpose: these are bare-metal assembly
; programs. avr-gcc still links its C runtime (crt*.o), which sets up the
; interrupt vector table, zeroes RAM, initializes the stack pointer, and then
; jumps to the symbol `main` - which is why every lesson defines `main`.

[platformio]
src_dir = lessons
default_envs = mega-01-blink

[env]
platform = atmelavr
board_build.f_cpu = 16000000L
monitor_speed = 9600

; --- Board definitions, shared by the lesson envs below via `extends` --------
[mega]
board = megaatmega2560          ; ATmega2560, 16 MHz

[uno]
board = uno                     ; ATmega328P, 16 MHz

; --- Lessons ----------------------------------------------------------------
[env:mega-01-blink]
extends = mega
build_src_filter = +<01-blink/>

[env:mega-02-hello-world]
extends = mega
build_src_filter = +<02-hello-world/>

[env:mega-03-echo]
extends = mega
build_src_filter = +<03-echo/>

[env:mega-04-sum]
extends = mega
build_src_filter = +<04-sum/>

[env:mega-05-absolute-value]
extends = mega
build_src_filter = +<05-absolute-value/>

[env:mega-06-button-led]
extends = mega
build_src_filter = +<06-button-led/>

[env:uno-01-blink]
extends = uno
build_src_filter = +<01-blink/>

[env:uno-02-hello-world]
extends = uno
build_src_filter = +<02-hello-world/>

[env:uno-03-echo]
extends = uno
build_src_filter = +<03-echo/>

[env:uno-04-sum]
extends = uno
build_src_filter = +<04-sum/>

[env:uno-05-absolute-value]
extends = uno
build_src_filter = +<05-absolute-value/>

[env:uno-06-button-led]
extends = uno
build_src_filter = +<06-button-led/>
